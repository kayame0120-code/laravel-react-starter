# ============================================================
#  fly.toml — laravel-react-starter テンプレート
#
#  版（PHP / Node）はこのファイルでは扱わない。正本は Dockerfile の ENV。
#  ここに [build.args] を書き戻さない ── 同じ数字が2箇所に散ると、
#  実際にどちらが効いたのかがログを見るまで分からなくなる。
#
#  DBは SQLite。実体は Fly Volume 上の /data/database.sqlite。
#  ボリュームはマシンごとに独立して存在するため、マシンを2台にすると
#  DBが2つに割れて別々のデータになる。このアプリは1台で運用する。
#      初回      fly deploy --ha=false
#      増えたら  fly scale count 1
# ============================================================

app = 'CHANGEME-app-name'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

# [deploy] の release_command は置かない。
# release_command が作る一時マシンにはボリュームが付かず /data に到達できない
# （Fly公式が「ビルド時」「release_command の一時マシン」でボリュームは使えないと明記）。
# マイグレーションは .fly/scripts/00-database.sh の起動時実行に移した。
# 「デプロイしたのにテーブルが無い」を防ぐ役割はそちらが引き継ぐ。

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_SECURE_COOKIE = 'true'

  # --- SQLite ---
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/data/database.sqlite'

  # SQLite への書き込みを増やさないため、セッション・キャッシュ・キューはDBに置かない。
  # キューを database にすると、ゼロスケール中はワーカーが居らずジョブが永久に滞留する。
  SESSION_DRIVER = 'cookie'
  CACHE_STORE = 'file'
  QUEUE_CONNECTION = 'sync'

[mounts]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # 'suspend' は復帰時にメモリ像を丸ごと確保し直すため、
  # ホストが混んでいると mem_overcommit_exceeded で起きられなくなる。
  # 'stop' は通常の起動経路を通るので、その門に引っかからない。
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/up'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1